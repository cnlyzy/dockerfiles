user  nginx www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  10000;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    #default_type  application/octet-stream;
    client_max_body_size 32M;
    #client_body_buffer_size 1128k;

    # =================================================================
    # --- 开始：Cloudflare 真实 IP 获取配置 ---
    # =================================================================
    # IPv4 段
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 段
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # 告诉 Nginx 取用哪个请求头
    real_ip_header CF-Connecting-IP;
    
    # ⚠️【注意】：如果你前面还套了 AWS 的内网负载均衡器 (ALB)，请把下面这行解开注释，并写上你所在的 AWS VPC 网段
    # set_real_ip_from 10.0.0.0/16; 
    # real_ip_recursive on;
    # =================================================================
    # --- 结束：Cloudflare 真实 IP 获取配置 ---
    # =================================================================

    # 你的日志配置保持不变（此时里面的 $remote_addr 已经自动变成真实的客户IP了）
    log_format compression escape=json '{"@timestamp":"$time_iso8601",'
                               '"ip":"$remote_addr","host":"$http_host",'
                               '"request":"$request","request_body":"$request_body",'
                               '"status":"$status","size":$body_bytes_sent,'
                               '"ua":"$http_user_agent","cookie":"$http_cookie",'
                               '"request_time":"$request_time",'
                               '"referer":"$http_referer",'
                               '"xff":"$http_x_forwarded_for",'
                               '"ust":"$upstream_status",'
                               '"uip":"$upstream_addr",'
                               '"ut":"$upstream_response_time"}';

    #access_log  logs/access.log  main;
    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    #keepalive_timeout  0;
    keepalive_timeout  6500;
    fastcgi_read_timeout 3600; 

    # 你的并发限制策略（此时 $binary_remote_addr 完美针对真实单 IP 发挥作用，拦截 CC 攻击绝不误伤！）
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=20r/s;

    include /etc/nginx/conf.d/*.conf;
}
